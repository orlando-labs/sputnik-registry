upstream sputnik_registry {
    server 192.168.1.97:18097;
    keepalive 16;
}

server {
    listen 80;
    server_name registry.sputnik-lang.online;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://registry.sputnik-lang.online$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name registry.sputnik-lang.online;
    ssl_certificate /etc/letsencrypt/live/registry.sputnik-lang.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registry.sputnik-lang.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 2g;
    client_body_timeout 7200s;
    access_log /var/log/nginx/sputnik-registry.access.log main;
    error_log /var/log/nginx/sputnik-registry.error.log;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://sputnik_registry;
        proxy_http_version 1.1;
        proxy_set_header Host registry.sputnik-lang.online;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        proxy_next_upstream off;
    }
}
